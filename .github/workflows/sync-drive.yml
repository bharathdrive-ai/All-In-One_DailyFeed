name: Daily Drive PDF sync

on:
  schedule:
    # 00:30 UTC = 06:00 IST, every day
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-drive
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Drive client
        run: pip install google-api-python-client google-auth

      - name: Download new PDFs
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: python sync_drive.py

      - name: Commit new PDFs
        run: |
          git add documents/
          if git diff --cached --quiet; then
            echo "No new PDFs today."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: sync PDFs from Google Drive ($(date -u +%F))"
          git push
